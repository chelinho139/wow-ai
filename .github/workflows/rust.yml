name: rust

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        run: rustup update stable --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Install check tools
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: cargo run --locked -- --help
      - run: cargo run --locked -- --version
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 22
          cache: npm
      - name: Install Lua test tooling
        if: runner.os == 'Linux'
        run: npm ci
      - name: Check legacy fixtures and load Rust slots in Lua
        if: runner.os == 'Linux'
        run: |
          node rust/bridge/tests/generate-fixtures.cjs
          git diff --exit-code -- rust/bridge/tests/fixtures
          node rust/bridge/tests/validate-slot.cjs
